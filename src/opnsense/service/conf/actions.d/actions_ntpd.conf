[status]
command:/usr/local/sbin/pluginctl -s ntpd status
parameters:
type:script_output
message:Requesting NTP daemon status

[ntpq]
command:/usr/local/opnsense/scripts/ntpd/ntpd_status.php
parameters:
type:script_output
message:Showing ntpd peer and GPS status

[list.serial_ports]
command:/usr/local/opnsense/scripts/ntpd/list_serial_ports.php
parameters:
type:script_output
cache_ttl:60
message:List serial ports

[start]
command:/usr/local/sbin/pluginctl -s ntpd start
type:script
message:Starting NTP daemon

[stop]
command:/usr/local/sbin/pluginctl -s ntpd stop
type:script
message:Stopping NTP daemon
allowed_groups:wheel,wwwonly

[restart]
command:/usr/local/sbin/pluginctl -s ntpd restart
type:script
message:Restarting NTP daemon
description:Restart NTP daemon

[configure]
command:/usr/local/sbin/pluginctl -c ntpd
type:script
message:Reconfiguring NTP daemon
