#======================================================================================
# drop pipes/queues configured with classic (non-fq) CoDel or PIE, so dummynet doesn't
# refuse to (re)configure their AQM while they're still carrying traffic ("flowset
# busy" in dmesg, exit 0, no AQM applied). fq_codel/fq_pie schedulers are unaffected
# by this and are left alone.
#======================================================================================
{% if helpers.exists('OPNsense.TrafficShaper.queues.queue') %}
{% for queue in helpers.toList('OPNsense.TrafficShaper.queues.queue') %}
{%    if queue.codel_enable|default('0') == '1' or queue.pie_enable|default('0') == '1' %}
queue {{ queue.number }} delete
{%    endif %}
{% endfor %}
{% endif %}
{% if helpers.exists('OPNsense.TrafficShaper.pipes.pipe') %}
{% for pipe in helpers.toList('OPNsense.TrafficShaper.pipes.pipe') %}
{%    if (pipe.codel_enable|default('0') == '1' and pipe.scheduler != 'fq_codel') or (pipe.pie_enable|default('0') == '1' and pipe.scheduler != 'fq_pie') %}
pipe {{ pipe.number }} delete
{%    endif %}
{% endfor %}
{% endif %}
